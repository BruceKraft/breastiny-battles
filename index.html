<style>
:root{--red:#e3350d;--yellow:#ffcb05;--blue:#3b4cca;--panel:#f8f8f0;--ink:#282828;--line:#222}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Press Start 2P',ui-monospace,monospace;font-size:11px;line-height:1.7;color:#fff;background:#0b0e2b;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
   radial-gradient(circle at 20% 15%,#3b4cca55,transparent 45%),
   radial-gradient(circle at 85% 80%,#e3350d44,transparent 45%),
   linear-gradient(#0b0e2b,#171a4a)}
#bg::after{content:"";position:absolute;inset:-50%;background-image:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:40px 40px;transform:perspective(500px) rotateX(60deg) translateY(0);animation:grid 6s linear infinite}
@keyframes grid{to{background-position:0 40px}}
.ball{position:absolute;image-rendering:pixelated;opacity:.6;animation:floaty linear infinite}
@keyframes floaty{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-20vh) rotate(360deg)}}

.screen{display:none;position:relative;z-index:1;min-height:100vh;padding:18px;max-width:980px;margin:0 auto}
.screen.active{display:block;animation:fadein .25s ease-out both}
@keyframes fadein{from{opacity:0}to{opacity:1}}

.logo{text-align:center;margin:24px 0 8px}
.logo .big{display:block;font-size:clamp(26px,7vw,54px);color:var(--yellow);-webkit-text-stroke:3px var(--blue);paint-order:stroke fill;text-shadow:0 6px 0 #1b2370;letter-spacing:2px;animation:bob 2.2s ease-in-out infinite}
.logo .small{display:block;margin-top:10px;font-size:clamp(11px,3vw,18px);color:#fff;text-shadow:2px 2px 0 #000;letter-spacing:4px}
@keyframes bob{50%{transform:translateY(-6px)}}
.panel{background:var(--panel);color:var(--ink);border:4px solid var(--line);border-radius:12px;box-shadow:0 0 0 4px #fff inset,0 6px 0 #0007;padding:18px}
.btn{font:inherit;font-size:11px;background:var(--yellow);color:#222;border:4px solid var(--line);border-radius:8px;padding:12px 16px;cursor:pointer;box-shadow:0 4px 0 #222;transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 #222}
.btn.red{background:var(--red);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.grey{background:#ddd}
.btn.small{padding:8px 10px;font-size:9px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
input{font:inherit;font-size:11px;width:100%;padding:12px;border:4px solid var(--line);border-radius:8px;background:#fff;color:#222;margin:6px 0 12px}
input:focus{outline:3px solid var(--blue)}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs .btn{flex:1}
.tabs .btn.on{background:var(--red);color:#fff}
.err{color:#c0152a;min-height:18px;font-size:10px}
.muted{opacity:.7;font-size:9px}
.tb{display:inline-block;padding:2px 7px;border-radius:5px;font-size:8px;color:#fff;text-shadow:1px 1px 0 #0007;border:2px solid #222;margin-right:4px}

.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}
.menu-grid .btn{padding:22px 12px;font-size:13px}
.statline{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
.statline b{color:var(--red)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.tile{cursor:pointer;text-align:center;padding:10px;background:var(--panel);color:var(--ink);border:4px solid var(--line);border-radius:10px;transition:transform .12s}
.tile:hover{transform:translateY(-4px)}

.card h3{font-size:14px;margin-bottom:6px}
.dhp{margin:2px 0 8px}.dtop{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}.dinfo{flex:1;min-width:0}.dnum{font-size:10px;color:#666;margin-bottom:4px}.dinfo h3{margin-bottom:6px;overflow-wrap:anywhere}
.card .sp{width:110px;height:110px;flex:none;margin:0}
.stat{display:flex;align-items:center;gap:6px;font-size:8px;margin:3px 0}
.stat span:first-child{width:62px}
.stat .bar{flex:1;height:8px;background:#ccc;border:2px solid #222;border-radius:4px;overflow:hidden}

.mv{margin:6px 0;font-size:8px;line-height:1.5}

.wr{display:block;font-size:8px;margin-top:8px;line-height:2}

@media(max-width:640px){.detail{grid-template-columns:1fr}}

#arena{position:relative;height:350px;border:4px solid var(--line);border-radius:12px;overflow:hidden;background:linear-gradient(#8fd3ff 0 52%,#9be37d 52%);box-shadow:0 6px 0 #0007}

.hpbar{flex:1;height:10px;background:#555;border:2px solid #222;border-radius:6px;overflow:hidden}

@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-50px)}}
.lungeP{animation:lungeP .4s}.lungeE{animation:lungeE .4s}
@keyframes lungeP{40%{transform:translate(70px,-40px) scale(1.06)}}
@keyframes lungeE{40%{transform:translate(-70px,40px) scale(1.06)}}
.hit{animation:hit .45s}
@keyframes hit{0%,100%{transform:none;filter:none}15%{transform:translateX(-10px);filter:brightness(3)}35%{transform:translateX(10px);filter:brightness(.4)}55%{transform:translateX(-7px);filter:brightness(3)}75%{transform:translateX(5px)}}
.glow{animation:glow .7s}
@keyframes glow{50%{filter:drop-shadow(0 0 14px #5f5) brightness(1.4)}}
.shield{animation:shield .7s}
@keyframes shield{50%{filter:drop-shadow(0 0 16px #6cf) brightness(1.3);transform:scale(1.05)}}
#pF.faint,#eF.faint{animation:faint 1.5s ease-in forwards}
@keyframes faint{30%{opacity:.9;filter:grayscale(1) brightness(1.8)}100%{opacity:0;filter:grayscale(1) blur(6px);transform:translateY(-35px) scale(1.06)}}
.puff{position:absolute;background:#ddd;opacity:0;z-index:6;pointer-events:none;animation:puff 1.1s ease-out forwards}@keyframes puff{0%{opacity:.9}100%{opacity:0;transform:translateY(-60px) scale(.3)}}
.slidein{animation:slidein .7s}
@keyframes slidein{from{opacity:0;transform:translateX(120px)}}
.slideinP{animation:slideinP .7s}
@keyframes slideinP{from{opacity:0;transform:translateX(-120px)}}
.bottom{display:grid;grid-template-columns:1.1fr 1fr;gap:12px;margin-top:12px}

th{color:var(--red)}

@keyframes fx{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4);opacity:0}}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translate(-6px,3px)}50%{transform:translate(6px,-3px)}75%{transform:translate(-3px,2px)}}
.pips{margin-top:6px}.pips i{display:inline-block;width:16px;height:16px;background:url(assets/mc/full.png) center/contain no-repeat;image-rendering:pixelated;margin-right:3px;filter:drop-shadow(0 1px 0 #0006)}.pips i.ko{visibility:hidden}

.btn{letter-spacing:.5px}.hpfill{background-image:repeating-linear-gradient(90deg,#0000 0 9px,#0003 9px 10px)}
.panel{background-image:linear-gradient(#fff9 0,#0000 40%)}

.dlogo{width:clamp(130px,24vw,210px);image-rendering:pixelated;filter:drop-shadow(0 6px 0 #000a);animation:bob 2.2s ease-in-out infinite}

.menu-grid .btn:hover{transform:translateY(-4px)}

@keyframes lungeP{40%{transform:translateX(150px) scale(1.08)}}@keyframes lungeE{40%{transform:translateX(-150px) scale(1.08)}}
.fx{width:28px;height:28px}
@media(max-width:700px){#pF,#eF{width:115px;height:115px;bottom:16%}#pF{left:4%}#eF{right:4%}#pPlat,#ePlat{width:140px}.hpbox{width:150px}@keyframes lungeP{40%{transform:translateX(70px)}}@keyframes lungeE{40%{transform:translateX(-70px)}}}
.sp img{object-fit:contain}
#msg.mc{background:#000b;color:#fff;text-shadow:2px 2px 0 #3f3f3f;box-shadow:none}#msg.mc.y{color:#ffff55}

<body>
<div id="bg" class="menubg"></div>

<section id="screen-login" class="screen active">
  <div class="logo"><img src="assets/destiny.png" class="dlogo" alt="Destiny"></div>
  <div class="panel" style="max-width:440px;margin:22px auto">
    <div class="tabs">
      <button class="btn on" id="tab-login" type="button">Log in</button>
      <button class="btn" id="tab-signup" type="button">Sign up</button>
    </div>
    <form id="authForm" autocomplete="off">
      <label>Name</label>
      <input id="authUser" maxlength="16" placeholder="Your name" required>
      <label>Password</label>
      <input id="authPass" type="password" placeholder="••••" required>
      <div class="err" id="authErr"></div>
      <button class="btn red" id="authGo" style="width:100%">Log in</button>
    </form>
    
  </div>
</section>

<section id="screen-menu" class="screen">
  <div class="logo"><img src="assets/destiny.png" class="dlogo" alt="Destiny"></div>
  <div class="panel">
    <h2 id="welcome"></h2>
    <div class="statline" id="myStats"></div>
  </div>
  <div class="menu-grid">
    <button class="btn red mi" data-go="mode"><img src="assets/diamond_sword.png" alt="">BATTLE</button>
    <button class="btn blue mi" data-go="dex"><img src="assets/chest.png" alt="">MEMBERS</button>
    <button class="btn red mi" data-go="story"><img src="assets/tp/item/enchanted_book.png" alt="" style="image-rendering:pixelated">STORY MODE</button>
    <button class="btn mi" data-go="board"><img src="assets/gold_block.png" alt="">LEADERBOARD</button>
    <button class="btn mi" data-go="profile"><img src="assets/diamond.png" alt="">PROFILE</button>
    <button class="btn blue mi" data-go="friends"><img src="assets/golden_apple.png" alt="">FRIENDS<span class="badge" id="frBadge"></span></button>
    <button class="btn mi" data-go="settings"><img src="assets/redstone.png" alt="">SETTINGS</button>
    <button class="btn mi" id="adminBtn" data-go="admin" style="display:none"><img src="assets/mc/mace.png" alt="" style="image-rendering:pixelated">ADMIN</button>
    <button class="btn grey mi" id="logoutBtn"><img src="assets/barrier.png" alt="">LOG OUT</button>
  </div>
</section>

<section id="screen-dex" class="screen">
  <div class="row" style="justify-content:space-between"><h2 style="text-shadow:2px 2px 0 #000">MEMBERS</h2><button class="btn small" data-go="menu">← Back</button></div>
  <div class="cards" id="dexCards"></div>
</section>

<section id="screen-board" class="screen">
  <div class="row" style="justify-content:space-between"><h2 style="text-shadow:2px 2px 0 #000">LEADERBOARD</h2><button class="btn small" data-go="menu">← Back</button></div>
  <div class="panel" style="margin-top:14px"><div id="boardBody"></div></div>
</section>

<section id="screen-mode" class="screen"><div class="row" style="justify-content:space-between"><h2 style="text-shadow:2px 2px 0 #000">CHOOSE MODE</h2><button class="btn small" data-go="menu">← Back</button></div>
<div class="menu-grid"><button class="btn red mi" id="modeBot"><img src="assets/diamond_sword.png" alt="">VS BOT</button><button class="btn blue mi" id="modePlayer"><img src="assets/golden_apple.png" alt="">VS PLAYER (QUEUE)</button></div></section>
<section id="screen-size" class="screen"><div class="row" style="justify-content:space-between"><h2 style="text-shadow:2px 2px 0 #000">CHOOSE MATCH</h2><button class="btn small" data-go="mode">← Back</button></div>
<div class="menu-grid"><button class="btn red mi" id="sizeQuick"><img src="assets/golden_apple.png" alt="">QUICK MATCH</button><button class="btn blue mi" id="sizeFull"><img src="assets/diamond_sword.png" alt="">NORMAL MATCH</button></div></section>
<section id="screen-profile" class="screen"><div class="row" style="justify-content:space-between"><h2 style="text-shadow:2px 2px 0 #000">YOUR PROFILE</h2><button class="btn small" data-go="menu">← Back</button></div>
<div class="panel" style="max-width:480px;margin:14px auto"><div class="center"><img id="pfPic" class="pfp click" alt="" title="Click to change picture"><div class="muted">Click the picture to change it</div></div><input type="file" id="pfFile" accept="image/*" hidden><label>Name</label><input id="pfName" maxlength="16"><label>New password (optional)</label><input id="pfPass" type="password"><label>Bio</label><textarea id="pfBio" maxlength="120"></textarea><div class="err" id="pfErr"></div><button class="btn red" id="pfSave" style="width:100%">Save</button></div></section>
<section id="screen-view" class="screen"><div class="row" style="justify-content:space-between"><h2 style="text-shadow:2px 2px 0 #000">PROFILE</h2><button class="btn small" data-go="board">← Back</button></div><div class="panel center" id="viewBody" style="max-width:480px;margin:14px auto"></div></section>
<section id="screen-settings" class="screen"><div class="row" style="justify-content:space-between"><h2 style="text-shadow:2px 2px 0 #000">SETTINGS</h2><button class="btn small" data-go="menu">← Back</button></div><div class="panel" id="setBody" style="max-width:480px;margin:14px auto"></div></section>
<section id="screen-admin" class="screen"><div class="row" style="justify-content:space-between"><h2 style="text-shadow:2px 2px 0 #000">ADMIN</h2><button class="btn small" data-go="menu">← Back</button></div><div class="panel" id="admBody" style="max-width:700px;margin:14px auto"></div></section>
<section id="screen-friends" class="screen"><div class="row" style="justify-content:space-between"><h2 style="text-shadow:2px 2px 0 #000">FRIENDS</h2><button class="btn small" data-go="menu">← Back</button></div><div class="panel" id="frBody" style="max-width:640px;margin:14px auto"></div></section>
<!-- SELECT -->
<section id="screen-select" class="screen">
  <div class="row" style="justify-content:space-between"><h2 id="pickTitle" style="text-shadow:2px 2px 0 #000">CHOOSE 3 MEMBERS</h2><button class="btn small" data-go="menu">← Back</button></div>
  <div class="grid" id="pickGrid"></div>
  <div class="panel detail" id="pickDetail"><div class="muted" style="grid-column:1/-1;align-self:center;text-align:center;font-size:12px">Hover a member to see their stats</div></div>
  <div class="center muted" id="readyNote" style="margin-top:12px"></div>
  <div class="center" style="margin-top:16px"><button class="btn red" id="startBtn" disabled>START BATTLE!</button></div>
</section>

<div id="presDot"></div>
<!-- BATTLE -->
<section id="screen-story" class="screen"></section>

<section id="screen-battle" class="screen">
  <div class="row" style="justify-content:space-between;margin-bottom:10px">
    <button class="btn small grey" id="runBtn"><img src="assets/white_wool.png" alt="" style="width:18px;height:18px;image-rendering:pixelated;vertical-align:middle"> Give up</button>
    <button class="btn small grey" id="muteBtn"><img src="assets/sculk_catalyst.png" alt="Sound" style="width:20px;height:20px;image-rendering:pixelated;vertical-align:middle"></button>
  </div>
  <div id="watchBar" class="muted" style="text-shadow:1px 1px 0 #000;min-height:14px;margin-bottom:6px"></div>
  <div id="arena">
    <div class="platform" id="ePlat"></div><div class="platform" id="pPlat"></div>
    <div class="fighter" id="eF"></div><div class="fighter" id="pF"></div>
    <div class="hpbox" id="eBox"></div><div class="hpbox" id="pBox"></div>
  </div>
  <div class="bottom">
    <div id="msg"></div>
    <div id="actions"><div id="moves"></div><button class="btn" id="swBtn" style="display:none"><img src="assets/mc/ender_pearl.png" alt=""><span>SWITCH</span></button></div>
  </div>
  <div id="info"></div>
</section>

<div class="overlay" id="invBox"><div class="panel"><h2>DUEL!</h2><p id="invText"></p><div class="row" style="justify-content:center"><button class="btn red" id="invYes">Accept</button><button class="btn grey" id="invNo">Decline</button></div></div></div>
<div class="overlay" id="queueBox"><div class="panel"><h2>SEARCHING...</h2><p id="qText">Looking for another player</p><button class="btn grey" id="qCancel">Cancel</button></div></div>
<div class="overlay" id="stEnd"><div class="panel"><h2></h2><p></p><div class="row" style="justify-content:center;margin-top:16px"></div></div></div>
<div class="overlay" id="result"><div class="panel"><h2 id="resTitle"></h2><p id="resText"></p><p id="rmNote" class="muted" style="color:#2e9d3a"></p>
  <div class="row" style="justify-content:center;margin-top:16px">
    <button class="btn red" id="rematchBtn">Rematch</button>
    <button class="btn blue" id="changeBtn">Change Members</button>
    <button class="btn grey" id="menuBtn">Leave</button>
  </div></div></div>

<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script defer src="story/story-art.js"></script>
<script defer src="story/story-data.js"></script>
<script defer src="story/story.js"></script>
<script defer src="story/story-games.js"></script>
<script defer src="story/story-ui.js"></script>
<script defer src="story/story-world.js"></script>
<script defer src="story/story-script.js"></script>
</body>
